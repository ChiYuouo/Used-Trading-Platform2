<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
<body>
<header class="copy" th:fragment="copy">
    <span class="short_nav"></span>
    <div class="home_icon">
        <a href="/">
            <span class="brand_badge">C2C</span>
            <span>校园二手交易平台</span>
        </a>
    </div>
    <div class="header_search_box">
        <input type="text" placeholder="搜索教材、数码、生活好物..." name="search" class="nav_search_input"
               th:value="${searchKeyword != null ? searchKeyword : ''}"/>
        <span class="search_icon" title="搜索"></span>
    </div>
    <div class="header_user_area">
        <span class="user_icon"></span>
        <span class="login_or_register_string">
            <a href="/login.do" th:if="${userInformation.username}==null" id="user_name_a" th:value="wsk">登录 / 注册</a>
            <a href="/personal_info.do" class="user_name_a"
               th:if="${userInformation.username!=null}" th:text="${userInformation.username} + ' ▾'"
               th:value="${userInformation.phone}" id="user_name_a"></a>
        </span>
    </div>
</header>
</body>
</html>
