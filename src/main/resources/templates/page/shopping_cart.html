<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>我的购物车 - 校园二手交易平台</title>
    <link rel="icon" href="/img/page_icon.png"/>
    <link rel="stylesheet" href="/css/home_page/header_and_nav.css"/>
    <link rel="stylesheet" href="/css/shopping_cart/shopping_cart.css"/>
    <script src="/js/jquery-1.12.4.js"></script>
    <script src="/js/home/header_model_js.js"></script>
    <script src="/js/shopping_cart/shopping_cart.js"></script>
</head>
<body>
<header th:include="header :: copy"></header>
<div th:include="short_nav_show :: short_nav_show" class="short_nav_show"></div>
<nav th:include="my_nav :: my_nav" class="my_nav"></nav>
<div th:include="personal_nav :: personal_nav" class="personal_nav"></div>

<div class="top_content">
    <div class="publish_product_div">
        <h3 style="margin:0 0 14px 0;font-size:17px;color:#0f172a;">收货地址与订单备注</h3>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;">
            <div>
                <label for="order_address" style="display:block;font-size:13px;font-weight:600;color:#475569;margin-bottom:6px;">校内收货地址（必填）</label>
                <input id="order_address" type="text"
                       style="width:100%;padding:9px 12px;border:1px solid #cbd5e1;border-radius:8px;font-size:14px;"
                       placeholder="如：北苑3栋301 张三 13800138000"
                       th:value="${(userInformation.dormitory != null ? userInformation.dormitory + ' ' : '') + (userInformation.realname != null ? userInformation.realname + ' ' : '') + (userInformation.phone != null ? userInformation.phone : '')}"/>
            </div>
            <div>
                <label for="order_context" style="display:block;font-size:13px;font-weight:600;color:#475569;margin-bottom:6px;">订单备注（选填）</label>
                <input id="order_context" type="text"
                       style="width:100%;padding:9px 12px;border:1px solid #cbd5e1;border-radius:8px;font-size:14px;"
                       placeholder="如：约定面交时间、验货说明等"/>
            </div>
        </div>
    </div>

    <div class="cart_content">
        <table>
            <tr class="table_head">
                <th colspan="4">商品信息</th>
                <th>单价</th>
                <th>数量</th>
                <th>小计</th>
                <th>操作</th>
            </tr>
            <tr th:if="${#lists.isEmpty(list)}">
                <td colspan="8" style="padding:48px;text-align:center;color:#64748b;font-size:14px;">
                    购物车还是空的，去<a href="/mall_page.do" style="color:#4f46e5;font-weight:600;text-decoration:none;">二手商城</a>逛逛吧！
                </td>
            </tr>
            <tr class="table_content" th:each="o:${list}" th:attr="data-cart-id=${o.id},data-stock=${o.stock}">
                <td class="input_checkbox">
                    <input type="checkbox" checked="checked" name="checkbox" th:value="${o.sid}"/>
                </td>
                <td class="show_img">
                    <img src="/img/home/feature_prodects/cont1.jpg" th:src="${o.image}" th:value="${o.sid}"
                         th:title="${o.name}"
                         onerror="this.onerror=null;this.src='/img/home/feature_prodects/cont1.jpg'"/>
                </td>
                <td class="title" colspan="2">
                    <a th:href="'/selectById.do?id='+${o.sid}" style="color:#0f172a;text-decoration:none;" th:text="${o.name}">商品名称</a>
                    <div style="font-size:12px;color:#94a3b8;font-weight:400;margin-top:4px;" th:text="${o.sort} + ' · 库存 ' + ${o.stock}">分类</div>
                </td>
                <td class="cost">￥<span th:text="${o.price}">0.00</span></td>
                <td class="count">
                    <span class="minus">-</span>
                    <span class="number" th:text="${o.quantity}">1</span>
                    <span class="add">+</span>
                </td>
                <td class="per_sum">￥<span th:with="sum=${o.price}*${o.quantity}" th:text="${sum}">0.00</span></td>
                <td class="delete_img">
                    <img src="/img/delete_icon.jpg" th:value="${o.id}" class="deleteShopCar" title="移出购物车"/>
                </td>
            </tr>
            <tr class="end_pay">
                <td class="is_all" colspan="2" style="text-align:left;padding-left:20px;">
                    <label style="cursor:pointer;font-size:14px;color:#334155;">
                        <input id="all" type="checkbox" checked="checked" style="margin-right:6px;"/>全选
                    </label>
                </td>
                <td class="space" colspan="2"></td>
                <td colspan="2" class="all_sum">合计：￥<span>0.00</span></td>
                <td colspan="2" class="pay_button_div" style="text-align:right;padding-right:24px;">
                    <button class="pay_button">提交订单结算</button>
                </td>
            </tr>
        </table>
    </div>
</div>

<footer>
    <p>Copyright © 2026 校园二手交易平台（Used-Trading-Platform）· 基于 Spring Boot 与 MyBatis</p>
</footer>
</body>
</html>
