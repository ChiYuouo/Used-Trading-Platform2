<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>个人信息与实名认证 - 校园二手交易平台</title>
    <link rel="stylesheet" href="/css/jquery-ui.css"/>
    <link rel="icon" href="/img/page_icon.png"/>
    <link rel="stylesheet" href="/css/home_page/header_and_nav.css"/>
    <link rel="stylesheet" href="/css/personal/personal_info.css"/>
    <script src="/js/jquery-1.12.4.js"></script>
    <script src="/js/jquery-ui.js"></script>
    <script src="/js/home/header_model_js.js"></script>
    <script src="/js/personal_info.js"></script>
</head>
<body>
<header th:include="header :: copy"></header>
<div th:include="short_nav_show :: short_nav_show" class="short_nav_show"></div>
<nav th:include="my_nav :: my_nav" class="my_nav"></nav>
<div th:include="personal_nav :: personal_nav" class="personal_nav"></div>
<div style="display: none" th:if="${message}!=null" class="show_tip" th:text="${message}" th:value="${message}"></div>
<input type="hidden" class="token" th:value="${token}"/>

<div class="top_content">
    <div class="publish_product_div">
        <div class="profile_header">
            <h2>个人资料与校园实名认证</h2>
            <span style="font-size:13px;color:#64748b;" th:text="'绑定手机：' + ${userInformation.phone}"></span>
        </div>
        <div id="accordion">
            <h3>用户名：<span class="username_span" th:text="${userInformation.username}">用户名</span></h3>
            <div class="info_content">
                <div class="first_info">
                    <span>用户名：</span><input type="text" class="userName" th:value="${userInformation.username}"/>
                    <span class="reqiure_enter">必须填写此字段</span>
                </div>
                <button class="update_button">确认修改</button>
            </div>
            <h3>真实姓名：<span class="realname_span" th:text="${userInformation.realname != null ? userInformation.realname : '未认证'}"></span></h3>
            <div class="info_content">
                <div class="first_info">
                    <span>真实姓名：</span><input type="text" class="realName" th:value="${userInformation.realname}"/>
                    <span class="reqiure_enter">必须填写此字段</span>
                </div>
                <button class="update_button">确认修改</button>
            </div>
            <h3>性别：<span class="sex_span" th:text="${userInformation.gender != null ? userInformation.gender : '未设置'}"></span></h3>
            <div class="info_content">
                <div class="first_info sex_info">
                    <span>性别：</span>
                    <label style="margin-right:16px;"><input class="gender" type="radio" name="sex_choose" value="男" th:checked="${userInformation.gender == null or userInformation.gender == '男'}"/> 男</label>
                    <label><input class="gender" type="radio" name="sex_choose" value="女" th:checked="${userInformation.gender == '女'}"/> 女</label>
                </div>
                <button class="update_button">确认修改</button>
            </div>
            <h3>班级：<span class="clazz_span" th:text="${userInformation.clazz != null ? userInformation.clazz : '未填写'}"></span></h3>
            <div class="info_content">
                <div class="first_info">
                    <span>班级：</span><input type="text" class="clazz" th:value="${userInformation.clazz}"/>
                    <span class="reqiure_enter">必须填写此字段</span>
                </div>
                <button class="update_button">确认修改</button>
            </div>
            <h3>学号：<span class="sno_span" th:text="${userInformation.sno != null ? userInformation.sno : '未认证'}"></span></h3>
            <div class="info_content">
                <div class="first_info">
                    <span>学号：</span><input type="text" class="sno" th:value="${userInformation.sno}"/>
                    <span class="reqiure_enter">必须填写此字段</span>
                </div>
                <button class="update_button">确认修改</button>
            </div>
            <h3>宿舍号：<span class="dormitory_span" th:text="${userInformation.dormitory != null ? userInformation.dormitory : '未认证'}"></span></h3>
            <div class="info_content">
                <div class="first_info">
                    <span>宿舍号：</span><input type="text" class="dormitory" th:value="${userInformation.dormitory}"/>
                    <span class="reqiure_enter">必须填写此字段</span>
                </div>
                <button class="update_button">确认修改</button>
            </div>
            <h3>账号安全：<span>修改登录密码</span></h3>
            <div class="info_content">
                <div class="first_info" style="flex-direction:column;align-items:flex-start;">
                    <div><span>原密码：</span><input type="password" class="oldPassword" placeholder="请输入原密码"/></div>
                    <div><span>新密码：</span><input type="password" class="newPassword" placeholder="6-32位新密码"/></div>
                    <div><span>确认密码：</span><input type="password" class="confirmNewPassword" placeholder="请再次输入新密码"/></div>
                </div>
                <button class="update_password_button">确认修改密码</button>
            </div>
        </div>
    </div>
</div>

<footer>
    <p>Copyright © 2026 校园二手交易平台（Used-Trading-Platform）· 基于 Spring Boot 与 MyBatis</p>
</footer>
</body>
</html>
