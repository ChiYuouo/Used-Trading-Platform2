<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>我求购的商品 - 校园二手交易平台</title>
    <link rel="icon" href="/img/page_icon.png"/>
    <link rel="stylesheet" href="/css/home_page/header_and_nav.css"/>
    <link href="/css/personal/my_publish_product.css" rel="stylesheet"/>
    <script src="/js/jquery-1.12.4.js"></script>
    <script src="/js/home/header_model_js.js"></script>
    <script>
        $(function () {
            $('.update_publish').click(function () {
                var id = $(this).attr('value');
                window.location.href = '/modified_require_product.do?id=' + id;
            });
            $('.delete_publish').click(function () {
                if (confirm("确定要删除这条求购信息吗？")) {
                    var id = $(this).attr('value');
                    window.location.href = "/deleteUserWant.do?id=" + id;
                }
            });
        });
    </script>
    <style>
        .require_content_div {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 20px;
        }
        .require_one_part {
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-left: 4px solid #4f46e5;
            border-radius: 12px;
            padding: 18px 20px;
            box-shadow: 0 4px 12px rgba(15, 23, 42, 0.04);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
    </style>
</head>
<body>
<header th:include="header :: copy"></header>
<div th:include="short_nav_show :: short_nav_show" class="short_nav_show"></div>
<nav th:include="my_nav :: my_nav" class="my_nav"></nav>
<div th:include="personal_nav :: personal_nav" class="personal_nav"></div>

<div class="temp_content">
    <div class="page_banner_bar">
        <h2>我发布的求购信息</h2>
        <a href="/require_product.do" class="primary_btn">+ 发布新求购</a>
    </div>
    <div class="require_content_div">
        <div th:if="${#lists.isEmpty(userWant)}"
             style="grid-column:1/-1;background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:56px;text-align:center;color:#64748b;">
            您还没有发布过求购信息，点击右上角发布需求吧！
        </div>
        <div class="require_one_part" th:each="o:${userWant}">
            <div style="display:flex;justify-content:space-between;align-items:center;">
                <strong style="font-size:16px;color:#0f172a;" th:text="${o.name}">求购名称</strong>
                <strong style="font-size:17px;color:#ef4444;" th:text="'预算 ￥'+${o.price}">预算 ￥0</strong>
            </div>
            <div style="font-size:12px;color:#64748b;">
                <span style="background:#eef2ff;color:#4f46e5;padding:2px 8px;border-radius:999px;margin-right:8px;" th:text="${o.sort}">分类</span>
                <span th:text="'数量：'+${o.quantity}">数量：1</span>
            </div>
            <p style="margin:6px 0 8px 0;padding:10px 12px;background:#f8fafc;border-radius:8px;font-size:13px;color:#475569;min-height:60px;" th:text="${o.remark}">详情</p>
            <div class="delete_and_update">
                <button type="button" class="btn_edit update_publish" th:value="${o.id}">修改求购</button>
                <button type="button" class="btn_delete delete_publish" th:value="${o.id}">删除</button>
            </div>
        </div>
    </div>
    <div class="pagination_div">
        <a class="pagination_lt" th:href="${currentPage > 1} ? @{/my_require_product.do(page=${currentPage - 1})} : 'javascript:void(0)'">&lt;</a>
        <ul>
            <li th:each="p : ${#numbers.sequence(1, totalPages)}" th:classappend="${p == currentPage} ? 'current_page'">
                <a th:href="@{/my_require_product.do(page=${p})}" th:text="${p}">1</a>
            </li>
        </ul>
        <a class="pagination_gt" th:href="${currentPage < totalPages} ? @{/my_require_product.do(page=${currentPage + 1})} : 'javascript:void(0)'">&gt;</a>
    </div>
</div>

<footer>
    <p>Copyright © 2026 校园二手交易平台（Used-Trading-Platform）· 基于 Spring Boot 与 MyBatis</p>
</footer>
</body>
</html>
