<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>我的收藏 - 校园二手交易平台</title>
    <link rel="icon" href="/img/page_icon.png"/>
    <link rel="stylesheet" href="/css/home_page/header_and_nav.css"/>
    <link href="/css/personal/my_publish_product.css" rel="stylesheet"/>
    <script src="/js/jquery-1.12.4.js"></script>
    <script src="/js/home/header_model_js.js"></script>
    <script>
        $(function () {
            $('.detail_product_name').click(function () {
                window.location.href = '/selectById.do?id=' + $(this).attr('data-sid');
            });
            $('.cancel_collect').click(function () {
                if (!confirm('确定取消收藏该商品吗？')) return;
                $.ajax({
                    url: '/deleteUserCollection.do',
                    type: 'post',
                    dataType: 'JSON',
                    data: {ucid: $(this).attr('data-ucid')},
                    success: function (data) {
                        if (data.result === 1) {
                            alert('已取消收藏');
                            window.location.reload();
                        } else {
                            alert(data.msg || '操作失败');
                        }
                    }
                });
            });
            $('.add_cart_btn').click(function () {
                $.ajax({
                    url: '/insertGoodsCar.do',
                    type: 'post',
                    dataType: 'JSON',
                    data: {id: $(this).attr('data-sid')},
                    success: function (data) {
                        alert(data.msg || (data.result === 1 ? '加入购物车成功' : '操作失败'));
                    }
                });
            });
        });
    </script>
</head>
<body>
<header th:include="header :: copy"></header>
<div th:include="short_nav_show :: short_nav_show" class="short_nav_show"></div>
<nav th:include="my_nav :: my_nav" class="my_nav"></nav>
<div th:include="personal_nav :: personal_nav" class="personal_nav"></div>

<div class="temp_content">
    <div class="page_banner_bar">
        <h2>我的收藏夹</h2>
        <a href="/mall_page.do" class="primary_btn">去商城逛逛</a>
    </div>
    <div class="product_content_div">
        <div th:if="${#lists.isEmpty(list)}"
             style="grid-column:1/-1;background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:56px;text-align:center;color:#64748b;">
            您还没有收藏任何商品，去<a href="/mall_page.do" style="color:#4f46e5;font-weight:600;text-decoration:none;">二手商城</a>发现心仪好物吧！
        </div>
        <figure class="detail_product" th:each="o:${list}">
            <div class="product_img_div">
                <a th:href="'/selectById.do?id='+${o.sid}">
                    <img src="/img/home/feature_prodects/cont2.jpg" th:src="${o.image}" class="show_img"
                         onerror="this.onerror=null;this.src='/img/home/feature_prodects/cont2.jpg'"/>
                </a>
            </div>
            <span class="detail_product_name" th:text="${o.name}" th:attr="data-sid=${o.sid}">商品名称</span>
            <p class="show_tip" th:text="${o.remark}"></p>
            <span class="detail_product_cost" th:text="'￥'+${o.price}">￥0.00</span>
            <span class="detail_type" th:text="${o.sort}">分类</span>
            <div class="delete_and_update">
                <button type="button" class="btn_edit add_cart_btn" th:attr="data-sid=${o.sid}" th:if="${o.display == 1}">加入购物车</button>
                <span th:if="${o.display == 0}" style="color:#94a3b8;font-size:12px;align-self:center;">商品已下架</span>
                <button type="button" class="btn_delete cancel_collect" th:attr="data-ucid=${o.id}">取消收藏</button>
            </div>
        </figure>
    </div>
    <div class="pagination_div">
        <a class="pagination_lt" th:href="${currentPage > 1} ? @{/my_collection.do(page=${currentPage - 1})} : 'javascript:void(0)'">&lt;</a>
        <ul>
            <li th:each="p : ${#numbers.sequence(1, totalPages)}" th:classappend="${p == currentPage} ? 'current_page'">
                <a th:href="@{/my_collection.do(page=${p})}" th:text="${p}">1</a>
            </li>
        </ul>
        <a class="pagination_gt" th:href="${currentPage < totalPages} ? @{/my_collection.do(page=${currentPage + 1})} : 'javascript:void(0)'">&gt;</a>
    </div>
</div>

<footer>
    <p>Copyright © 2026 校园二手交易平台（Used-Trading-Platform）· 基于 Spring Boot 与 MyBatis</p>
</footer>
</body>
</html>
