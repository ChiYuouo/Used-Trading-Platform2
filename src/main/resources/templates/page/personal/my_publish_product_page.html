<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>我发布的商品 - 校园二手交易平台</title>
    <link rel="icon" href="/img/page_icon.png"/>
    <link rel="stylesheet" href="/css/home_page/header_and_nav.css"/>
    <link href="/css/personal/my_publish_product.css" rel="stylesheet"/>
    <script src="/js/jquery-1.12.4.js"></script>
    <script src="/js/home/header_model_js.js"></script>
    <script>
        $(function () {
            $('.update_publish').click(function () {
                var id = $(this).attr('value');
                window.location.href = '/modifiedMyPublishProduct.do?id=' + id;
            });
            $('.delete_publish').click(function () {
                if (confirm("确定要下架该商品吗？")) {
                    var id = $(this).attr('value');
                    window.location.href = "/deleteShop.do?id=" + id;
                }
            });
            $('.detail_product_name').click(function () {
                var id = $(this).attr('value');
                window.location.href = '/selectById.do?id=' + id;
            });
        });
    </script>
</head>
<body>
<header th:include="header :: copy"></header>
<div th:include="short_nav_show :: short_nav_show" class="short_nav_show"></div>
<nav th:include="my_nav :: my_nav" class="my_nav"></nav>
<div th:include="personal_nav :: personal_nav" class="personal_nav"></div>

<div class="temp_content">
    <div class="page_banner_bar">
        <h2>我发布的闲置商品</h2>
        <a href="/publish_product.do" class="primary_btn">+ 发布新商品</a>
    </div>
    <div class="product_content_div">
        <div th:if="${#lists.isEmpty(shopInformationBean)}"
             style="grid-column:1/-1;background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:56px;text-align:center;color:#64748b;">
            您还没有发布过在售商品，点击右上角发布一件闲置吧！
        </div>
        <figure class="detail_product" th:each="o:${shopInformationBean}">
            <div class="product_img_div">
                <a th:href="'/selectById.do?id='+${o.id}">
                    <img src="/img/home/feature_prodects/cont2.jpg" th:src="${o.getImage()}" class="show_img"
                         onerror="this.onerror=null;this.src='/img/home/feature_prodects/cont2.jpg'"/>
                </a>
            </div>
            <span class="detail_product_name" th:text="${o.getName()}" th:value="${o.id}" th:title="${o.getName()}">商品名称</span>
            <p class="show_tip" th:text="${o.remark}" th:title="${o.remark}"></p>
            <span class="detail_product_cost" th:text="'￥'+${o.getPrice()}">￥0.00</span>
            <span class="detail_type" th:text="${o.getSort()} + ' · 库存 ' + ${o.quantity}">分类</span>
            <div class="delete_and_update">
                <button type="button" class="btn_edit update_publish" th:value="${o.getId()}">编辑商品</button>
                <button type="button" class="btn_delete delete_publish" th:value="${o.getId()}">下架</button>
            </div>
        </figure>
    </div>
    <div class="pagination_div">
        <a class="pagination_lt" th:href="${currentPage > 1} ? @{/my_publish_product_page.do(page=${currentPage - 1})} : 'javascript:void(0)'">&lt;</a>
        <ul>
            <li th:each="p : ${#numbers.sequence(1, totalPages)}" th:classappend="${p == currentPage} ? 'current_page'">
                <a th:href="@{/my_publish_product_page.do(page=${p})}" th:text="${p}">1</a>
            </li>
        </ul>
        <a class="pagination_gt" th:href="${currentPage < totalPages} ? @{/my_publish_product_page.do(page=${currentPage + 1})} : 'javascript:void(0)'">&gt;</a>
    </div>
</div>

<footer>
    <p>Copyright © 2026 校园二手交易平台（Used-Trading-Platform）· 基于 Spring Boot 与 MyBatis</p>
</footer>
</body>
</html>
