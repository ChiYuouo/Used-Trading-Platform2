<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>商品详情 - 校园二手交易平台</title>
    <link rel="icon" href="/img/page_icon.png"/>
    <link href="/css/home_page/header_and_nav.css" rel="stylesheet"/>
    <link href="/css/product/product_info.css" rel="stylesheet"/>
    <script src="/js/jquery-1.12.4.js"></script>
    <script src="/js/home/header_model_js.js"></script>
    <script src="/js/publish/product_info.js"></script>
</head>
<body>
<header th:include="header :: copy"></header>
<div th:include="short_nav_show :: short_nav_show" class="short_nav_show"></div>
<nav th:include="my_nav :: my_nav" class="my_nav"></nav>
<div th:include="personal_nav :: personal_nav" class="personal_nav"></div>

<div class="top_content">
    <div class="publish_product_div">
        <div class="product_top_grid">
            <div class="product_img_div">
                <img src="/img/home/p4.jpeg" class="product_img" th:src="${shopInformation.image}"
                     onerror="this.onerror=null;this.src='/img/home/feature_prodects/cont1.jpg'"/>
            </div>
            <div class="product_info_div">
                <input type="hidden" th:value="${shopInformation.id}" class="id"/>
                <h1 class="product_title_h1" th:text="${shopInformation.name}">商品名称</h1>
                <div class="product_price_bar">
                    <span style="color:#64748b;font-size:14px;">二手价</span>
                    <span class="price_value" th:text="'￥'+${shopInformation.price}">￥0.00</span>
                </div>
                <div class="product_meta_list">
                    <div class="product_meta_item">
                        <span class="what_info">成色：</span>
                        <span class="info_content" th:text="${shopInformation.level == 10 ? '全新' : shopInformation.level + '成新'}">七成新</span>
                    </div>
                    <div class="product_meta_item">
                        <span class="what_info">库存：</span>
                        <span class="info_content" th:text="${shopInformation.quantity} + ' 件'">1 件</span>
                    </div>
                    <div class="product_meta_item" style="grid-column: 1 / -1;">
                        <span class="what_info">分类：</span>
                        <span class="info_content" th:text="${sort}">分类</span>
                    </div>
                </div>
                <div class="product_remark_box">
                    <strong style="display:block;margin-bottom:4px;color:#0f172a;">卖家描述与联系方式：</strong>
                    <span class="info_content" th:text="${shopInformation.remark}">商品详情</span>
                </div>
                <div class="product_actions_row">
                    <button class="buy_button" th:value="${shopInformation.id}">加入购物车</button>
                    <button class="collect_button"
                            th:attr="data-sid=${shopInformation.id},data-collected=${collected},data-ucid=${collectionId}"
                            th:text="${collected} ? '★ 已收藏' : '☆ 收藏商品'">☆ 收藏商品</button>
                </div>
            </div>
        </div>

        <div class="publish_comment">
            <h3>商品留言咨询</h3>
            <input type="hidden" th:value="${token}" class="token"/>
            <textarea class="comment_textarea" maxlength="122" placeholder="对这件商品有疑问？给卖家留言沟通面交时间与细节吧（最多122字）" name="comment"></textarea>
            <div class="comment_submit_bar">
                <button class="send_comment_button">发表留言</button>
            </div>
        </div>

        <div class="comment_content">
            <div th:if="${#lists.isEmpty(shopContextBeans)}" style="text-align:center;color:#94a3b8;padding:24px 0;font-size:14px;">
                暂无留言，快来发表第一条咨询吧！
            </div>
            <div class="one_comment" th:each="o:${shopContextBeans}">
                <div class="one_comment_head">
                    <span class="username" th:text="'用户：'+${o.username}">用户</span>
                    <div>
                        <span class="time" th:with="time = ${o.modified}"
                              th:text="'发表于 '+${#dates.format(time,'yyyy-MM-dd HH:mm:ss')}">时间</span>
                        <a href="javascript:void(0)" class="delete_comment_btn"
                           th:if="${userInformation.id != null and userInformation.id == o.uid}"
                           th:attr="data-id=${o.id}"
                           style="margin-left:12px;color:#ef4444;font-size:12px;text-decoration:none;">删除</a>
                    </div>
                </div>
                <p class="content" th:text="${o.context}">留言内容</p>
            </div>
        </div>
    </div>
</div>

<footer>
    <p>Copyright © 2026 校园二手交易平台（Used-Trading-Platform）· 基于 Spring Boot 与 MyBatis</p>
</footer>
</body>
</html>
