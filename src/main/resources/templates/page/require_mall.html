<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>求购商城 - 校园二手交易平台</title>
    <script src="/js/jquery-1.12.4.js"></script>
    <script src="/js/home/header_model_js.js"></script>
    <script src="/js/mall/type_list_obj.js"></script>
    <link rel="icon" href="/img/page_icon.png"/>
    <link href="/css/home_page/header_and_nav.css" rel="stylesheet"/>
    <link href="/css/mall_page/mall_page_other.css" rel="stylesheet"/>
    <style>
        .require_content_div {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 18px;
        }
        .require_one_part {
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-left: 4px solid #4f46e5;
            border-radius: 12px;
            padding: 18px 20px;
            box-shadow: 0 4px 12px rgba(15, 23, 42, 0.04);
            display: flex;
            flex-direction: column;
            gap: 8px;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .require_one_part:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 24px rgba(15, 23, 42, 0.09);
        }
        .want_card_head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }
        .want_name {
            font-size: 16px;
            font-weight: 700;
            color: #0f172a;
        }
        .want_price {
            font-size: 17px;
            font-weight: 800;
            color: #ef4444;
            white-space: nowrap;
        }
        .want_meta {
            display: flex;
            gap: 10px;
            font-size: 12px;
            color: #64748b;
        }
        .want_tag {
            background: #eef2ff;
            color: #4f46e5;
            padding: 2px 8px;
            border-radius: 999px;
        }
        .want_remark {
            font-size: 13px;
            line-height: 1.65;
            color: #475569;
            background: #f8fafc;
            border-radius: 8px;
            padding: 10px 12px;
            min-height: 68px;
            margin: 4px 0 0 0;
        }
    </style>
    <script>
        function hideParticular() {
            if ($('.particular_type_div').is(":visible")) {
                $('.particular_type_div').hide(0);
            }
        }
        $(function () {
            var type_list = getTypeList();
            $('.my_type_div ul li').hover(function () {
                var idx = parseInt($(this).attr("class").replace("type_", ""), 10) - 1;
                var which = type_list[idx];
                if (!which) return;
                var my_string = "";
                for (var j = 0; j < which.length; j++) {
                    var type_i = which[j];
                    var arr = type_i.content;
                    var a_list = "";
                    for (var i = 0; i < arr.length; i++) {
                        a_list += "<a id='" + arr[i].id + "' class='shop_sort'>" + arr[i].name + "</a>";
                    }
                    my_string += "<div class='one_part'><div class='type_title_div'>" +
                        "<span class='type_border_span'>1</span><h3>" + type_i.name + "</h3></div><div " +
                        "class='type_goods_list'>" + a_list + "</div></div>";
                }
                var rect = $('.my_type_div')[0].getBoundingClientRect();
                $('.particular_type_div').html(my_string).css({
                    top: Math.max(120, rect.top) + 'px',
                    left: (rect.right + 12) + 'px'
                }).show(0);
                $('.type_goods_list a.shop_sort').click(function () {
                    var sortId = $(this).attr('id');
                    hideParticular();
                    $.ajax({
                        url: '/selectWantBySort.do',
                        type: 'post',
                        dataType: 'JSON',
                        data: {sort: sortId},
                        success: function (data) {
                            renderWants(data);
                        }
                    });
                });
            });
            function renderWants(data) {
                var $box = $('.require_content_div');
                $box.html('');
                if (!data || data.length === 0) {
                    $box.append("<div style='grid-column:1/-1;background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:48px;text-align:center;color:#64748b;'>该分类下暂无求购信息</div>");
                    return;
                }
                for (var i = 0; i < data.length; i++) {
                    $box.append(
                        "<div class='require_one_part'>" +
                        "<div class='want_card_head'><span class='want_name'>" + data[i].name + "</span><span class='want_price'>预算 ￥" + data[i].price + "</span></div>" +
                        "<div class='want_meta'><span class='want_tag'>" + data[i].sort + "</span><span>需求数量：" + data[i].quantity + "</span></div>" +
                        "<p class='want_remark'>" + data[i].remark + "</p>" +
                        "</div>"
                    );
                }
            }
        });
    </script>
</head>
<body>
<header th:include="header :: copy"></header>
<div th:include="short_nav_show :: short_nav_show" class="short_nav_show"></div>
<nav th:include="my_nav :: my_nav" class="my_nav"></nav>
<div th:include="personal_nav :: personal_nav" class="personal_nav"></div>

<div class="mall_layout">
    <aside class="my_type_div">
        <div class="type_header">求购分类筛选</div>
        <ul>
            <li class="type_1">数码科技</li>
            <li class="type_2">影音家电</li>
            <li class="type_3">鞋服配饰</li>
            <li class="type_4">运动代步</li>
            <li class="type_5">书籍文具</li>
            <li class="type_6">其他</li>
        </ul>
    </aside>

    <div class="particular_type_div" onmouseleave="hideParticular()"></div>

    <div class="temp_content" onmousedown="hideParticular()">
        <div class="mall_toolbar">
            <div>校内最新求购需求（共 <strong th:text="${totalCounts != null ? totalCounts : #lists.size(list)}">0</strong> 条）</div>
            <a href="/require_product.do" style="padding:7px 16px;background:#4f46e5;color:#fff;border-radius:8px;text-decoration:none;font-size:13px;font-weight:600;">+ 发布求购</a>
        </div>
        <div class="require_content_div">
            <div class="require_one_part" th:each="o:${list}">
                <div class="want_card_head">
                    <span class="want_name" th:text="${o.name}">求购商品</span>
                    <span class="want_price" th:text="'预算 ￥'+${o.price}">预算 ￥0</span>
                </div>
                <div class="want_meta">
                    <span class="want_tag" th:text="${o.sort}">分类</span>
                    <span th:text="'需求数量：'+${o.quantity}">需求数量：1</span>
                </div>
                <p class="want_remark" th:text="${o.remark}">需求详情</p>
            </div>
        </div>
        <div class="pagination_div" onmouseleave="hideParticular()">
            <a class="pagination_lt" th:href="${currentPage > 1} ? @{/require_mall.do(page=${currentPage - 1})} : 'javascript:void(0)'">&lt;</a>
            <ul>
                <li th:each="p : ${#numbers.sequence(1, totalPages)}" th:classappend="${p == currentPage} ? 'current_page'">
                    <a th:href="@{/require_mall.do(page=${p})}" th:text="${p}">1</a>
                </li>
            </ul>
            <a class="pagination_gt" th:href="${currentPage < totalPages} ? @{/require_mall.do(page=${currentPage + 1})} : 'javascript:void(0)'">&gt;</a>
        </div>
    </div>
</div>

<footer>
    <p>Copyright © 2026 校园二手交易平台（Used-Trading-Platform）· 基于 Spring Boot 与 MyBatis</p>
</footer>
</body>
</html>
