<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>登录 / 注册 - 校园二手交易平台</title>
    <script src="/js/jquery-1.12.4.js"></script>
    <script src="/js/login/init_login.js"></script>
    <link rel="icon" href="/img/page_icon.png"/>
    <link rel="stylesheet" th:href="@{/css/login_and_register/login_back.css}"/>
    <link rel="stylesheet" href="/css/login_and_register/register_page.css"/>
    <link rel="stylesheet" href="/css/login_and_register/confirm_password.css"/>
    <link rel="stylesheet" href="/css/login_and_register/forget_password.css"/>
</head>
<body>
<div class="stage">
    <div class="content">
        <!-- 登录界面 -->
        <div class="login">
            <div class="auth_brand_header">
                <div class="auth_brand_logo">C2C</div>
                <h2>欢迎回到校园二手</h2>
                <p>使用手机号和密码登录您的账号</p>
            </div>
            <form action="/login.do" method="post">
                <div class="login_form">
                    <div class="login_username">
                        <svg class="login_icon" viewBox="0 0 20 20">
                            <path d="M0,20 a10,8 0 0,1 20,0z M10,0 a4,4 0 0,1 0,8 a4,4 0 0,1 0,-8"></path>
                        </svg>
                        <input type="hidden" th:value="${token}" class="token" name="token"/>
                        <input type="text" placeholder="请输入11位手机号码" class="input_username placeholder" name="phone"/>
                    </div>
                    <div class="login_password">
                        <svg class="password_icon" viewBox="0 0 20 20">
                            <path d="M0,20 20,20 20,8 0,8z M10,13 10,16z M4,8 a6,8 0 0,1 12,0"></path>
                        </svg>
                        <input type="password" placeholder="请输入登录密码" class="input_password placeholder" name="password"/>
                    </div>
                    <div th:if="${msg}!=null" class="login_error_msg" th:text="${msg}"></div>
                    <div class="go_forget_password">
                        <a class="go_to_forget" href="#">忘记密码？</a>
                    </div>
                    <div class="login_button_div">
                        <button class="login_button" type="submit">立即登录</button>
                    </div>
                    <div class="register_info">
                        <span>还没有账号？<a class="flip_to_register" href="#">免费注册</a></span>
                    </div>
                    <a class="back_home_link" href="/">← 返回平台首页</a>
                </div>
            </form>
        </div>

        <!-- 注册界面 -->
        <div class="register_page">
            <div class="auth_brand_header">
                <div class="auth_brand_logo">C2C</div>
                <h2>注册新账号</h2>
                <p>填写昵称并验证手机号码</p>
            </div>
            <div class="get_vcode">
                <div class="nickname_div">
                    <span class="n_span">N</span>
                    <input class="input_nickname placeholder" type="text" placeholder="请输入用户昵称"/>
                </div>
                <div class="register_phone_div">
                    <svg class="register_phone_svg" viewBox="0 0 20 20">
                        <path d="M0,20 a10,8 0 0,1 20,0z M10,0 a4,4 0 0,1 0,8 a4,4 0 0,1 0,-8"></path>
                    </svg>
                    <input type="text" placeholder="请输入11位手机号码" class="register_input_phone placeholder"/>
                </div>
                <div class="register_vcode_div">
                    <input type="text" placeholder="请输入4位验证码" class="register_input_vcode placeholder"/>
                    <button class="get_vcode_button" type="button">获取验证码</button>
                </div>
                <button class="go_enter_password_button" type="button">下一步</button>
                <div class="go_back_login_div">
                    <a class="go_back_login" href="#">← 返回登录</a>
                </div>
            </div>
        </div>

        <!-- 设置密码界面 -->
        <div class="enter_password">
            <div class="auth_brand_header">
                <div class="auth_brand_logo">C2C</div>
                <h2>设置账号密码</h2>
                <p>请设置 6-32 位安全登录密码</p>
            </div>
            <div class="confirm_password_content">
                <div class="confirm_password_div">
                    <svg class="first_enter_password_icon" viewBox="0 0 20 20">
                        <path d="M0,20 20,20 20,8 0,8z M10,13 10,16z M4,8 a6,8 0 0,1 12,0"></path>
                    </svg>
                    <input type="password" placeholder="请输入密码（6-32位）" class="first_enter_password_input placeholder"/>
                </div>
                <div class="confirm_password_div">
                    <svg class="confirm_password_icon" viewBox="0 0 20 20">
                        <path d="M0,20 20,20 20,8 0,8z M10,13 10,16z M4,8 a6,8 0 0,1 12,0"></path>
                    </svg>
                    <input type="password" placeholder="请再次确认密码" class="confirm_password_input placeholder"/>
                </div>
                <div class="login_button_div">
                    <button class="confirm_register_button" type="button" onclick="return false;">完成注册</button>
                </div>
                <div class="go_back_up_div">
                    <a class="go_back_up" href="#">← 返回上一步</a>
                </div>
            </div>
        </div>

        <!-- 找回密码界面 -->
        <div class="forget_password">
            <div class="auth_brand_header">
                <div class="auth_brand_logo">C2C</div>
                <h2>找回密码</h2>
                <p>通过注册手机号获取验证码重置密码</p>
            </div>
            <div class="forget_get_vcode">
                <div class="forget_phone_div">
                    <svg class="register_phone_svg" viewBox="0 0 20 20">
                        <path d="M0,20 a10,8 0 0,1 20,0z M10,0 a4,4 0 0,1 0,8 a4,4 0 0,1 0,-8"></path>
                    </svg>
                    <input type="text" placeholder="请输入注册手机号码" class="forget_input_phone placeholder"/>
                </div>
                <div class="forget_get_vcode_div">
                    <input type="text" placeholder="请输入4位验证码" class="forget_input_vcode placeholder"/>
                    <button class="forget_get_vcode_button" type="button">获取验证码</button>
                </div>
                <button class="forget_password_button" type="button">下一步</button>
                <div class="go_back_login_div">
                    <a class="go_back_login_from_forget" href="#">← 返回登录</a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
