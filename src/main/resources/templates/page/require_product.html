<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>发布求购信息 - 校园二手交易平台</title>
    <link rel="icon" href="/img/page_icon.png"/>
    <link rel="stylesheet" href="/css/home_page/header_and_nav.css"/>
    <link rel="stylesheet" href="/css/product/require_product.css"/>
    <script src="/js/jquery-1.12.4.js"></script>
    <script src="/js/home/header_model_js.js"></script>
    <script src="/js/mall/type_list_obj.js"></script>
    <script src="/js/publish/publish_product.js"></script>
</head>
<body>
<header th:include="header :: copy"></header>
<div th:include="short_nav_show :: short_nav_show" class="short_nav_show"></div>
<nav th:include="my_nav :: my_nav" class="my_nav"></nav>
<div th:include="personal_nav :: personal_nav" class="personal_nav"></div>

<div class="top_content">
    <div class="publish_product_div">
        <h2 class="form_page_title">发布求购信息</h2>
        <form action="/publishUserWant.do" method="post">
            <input type="hidden" th:value="${token}" name="token"/>
            <input type="hidden" value="1" name="action"/>
            <div class="publish_one_par">
                <div class="publish_title"><h3>求购商品</h3></div>
                <div class="publish_content">
                    <input type="text" class="title_input" name="name" required="required" placeholder="请输入想要购买的物品名称"/>
                </div>
            </div>
            <div class="publish_one_par">
                <div class="publish_title"><h3>需求数量</h3></div>
                <div class="publish_content">
                    <input type="number" min="1" class="count_input" name="quantity" required="required" value="1"/>
                </div>
            </div>
            <div class="publish_one_par">
                <div class="publish_title"><h3>期望预算</h3></div>
                <div class="publish_content cost_content">
                    <input type="number" step="0.01" min="0.01" class="cost_input" name="price" required="required" placeholder="0.00"/>
                    <span style="color:#64748b;font-size:13px;">元（RMB）</span>
                </div>
            </div>
            <div class="publish_one_par">
                <div class="publish_title"><h3>需求详情</h3></div>
                <div class="publish_content">
                    <textarea class="detail_textarea" maxlength="255" placeholder="说明期望成色、型号要求并留下联系方式" name="remark" required="required"></textarea>
                </div>
            </div>
            <div class="publish_one_par">
                <div class="publish_title"><h3>商品分类</h3></div>
                <div class="publish_content">
                    <select class="choose_first_type">
                        <option id="type_1" selected="selected">数码科技</option>
                        <option id="type_2">影音家电</option>
                        <option id="type_3">鞋服配饰</option>
                        <option id="type_4">运动代步</option>
                        <option id="type_5">书籍文具</option>
                        <option id="type_6">其他</option>
                    </select><span class="to_left">/</span>
                    <select class="choose_second_type"></select><span class="to_left">/</span>
                    <select class="choose_third_type" name="sort"></select>
                </div>
            </div>
            <div class="submit_content_div">
                <input type="submit" value="发布求购" class="submit_input"/>
            </div>
        </form>
    </div>
</div>

<footer>
    <p>Copyright © 2026 校园二手交易平台（Used-Trading-Platform）· 基于 Spring Boot 与 MyBatis</p>
</footer>
</body>
</html>
