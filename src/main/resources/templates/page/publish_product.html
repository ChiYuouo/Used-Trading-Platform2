<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title th:text="${action == 2 ? '修改商品 - 校园二手交易平台' : '发布闲置商品 - 校园二手交易平台'}">发布商品</title>
    <link href="/css/home_page/header_and_nav.css" rel="stylesheet"/>
    <link rel="icon" href="/img/page_icon.png"/>
    <link href="/css/product/publish_product.css" rel="stylesheet"/>
    <script src="/js/jquery-1.12.4.js"></script>
    <script src="/js/home/header_model_js.js"></script>
    <script src="/js/mall/type_list_obj.js"></script>
    <script src="/js/publish/publish_product.js"></script>
</head>
<body>
<header th:include="header :: copy"></header>
<div th:include="short_nav_show :: short_nav_show" class="short_nav_show"></div>
<nav th:include="my_nav :: my_nav" class="my_nav"></nav>
<div th:include="personal_nav :: personal_nav" class="personal_nav"></div>
<div style="display: none" th:if="${message}!=null" th:value="${message}" th:text="${message}" class="show_tip"></div>

<div class="top_content">
    <div class="publish_product_div">
        <h2 class="form_page_title" th:text="${action == 2 ? '编辑闲置商品信息' : '发布闲置商品'}">发布闲置商品</h2>
        <form action="/insertGoods.do" method="post" enctype="multipart/form-data">
            <input type="hidden" th:value="${token}" name="token"/>
            <input type="hidden" th:value="${action}" name="action" class="action"/>
            <input type="hidden" th:value="${shopInformation.id != null ? shopInformation.id : 0}" name="id"/>

            <div class="publish_one_par">
                <div class="publish_title"><h3>商品名称</h3></div>
                <div class="publish_content">
                    <input type="text" class="title_input" name="name" maxlength="25" required="required"
                           placeholder="请输入商品名称（25字以内）"
                           th:value="${shopInformation.name}"/>
                </div>
            </div>

            <div class="publish_one_par">
                <div class="publish_title"><h3>商品成色</h3></div>
                <div class="publish_content">
                    <select class="choose_chengse" name="level">
                        <option value="3" th:selected="${shopInformation.level == 3}">三成新</option>
                        <option value="4" th:selected="${shopInformation.level == 4}">四成新</option>
                        <option value="5" th:selected="${shopInformation.level == 5}">五成新</option>
                        <option value="6" th:selected="${shopInformation.level == 6}">六成新</option>
                        <option value="7" th:selected="${shopInformation.level == null or shopInformation.level == 7}">七成新</option>
                        <option value="8" th:selected="${shopInformation.level == 8}">八成新</option>
                        <option value="9" th:selected="${shopInformation.level == 9}">九成新</option>
                        <option value="10" th:selected="${shopInformation.level == 10}">全新</option>
                    </select>
                </div>
            </div>

            <div class="publish_one_par">
                <div class="publish_title"><h3>出售单价</h3></div>
                <div class="publish_content cost_content">
                    <input type="number" step="0.01" min="0.01" class="cost_input" name="price" required="required"
                           placeholder="0.00" th:value="${shopInformation.price}"/>
                    <span style="color:#64748b;font-size:13px;">元（RMB）</span>
                </div>
            </div>

            <div class="publish_one_par">
                <div class="publish_title"><h3>库存数量</h3></div>
                <div class="publish_content">
                    <input type="number" min="1" class="count_input" name="quantity" required="required"
                           placeholder="1" th:value="${shopInformation.quantity != null ? shopInformation.quantity : 1}"/>
                </div>
            </div>

            <div class="publish_one_par">
                <div class="publish_title"><h3>商品详情</h3></div>
                <div class="publish_content">
                    <textarea class="detail_textarea" maxlength="122" placeholder="介绍商品使用情况并留下联系方式，方便买家联系（122字以内）"
                              name="remark" required="required" th:text="${shopInformation.remark}"></textarea>
                </div>
            </div>

            <div class="publish_one_par">
                <div class="publish_title"><h3>商品分类</h3></div>
                <div class="publish_content">
                    <select class="choose_first_type">
                        <option id="type_1" selected="selected">数码科技</option>
                        <option id="type_2">影音家电</option>
                        <option id="type_3">鞋服配饰</option>
                        <option id="type_4">运动代步</option>
                        <option id="type_5">书籍文具</option>
                        <option id="type_6">其他</option>
                    </select><span class="to_left">/</span>
                    <select class="choose_second_type"></select><span class="to_left">/</span>
                    <select class="choose_third_type" name="sort" th:attr="data-current-sort=${shopInformation.sort}"></select>
                </div>
            </div>

            <div class="publish_one_par">
                <div class="publish_title"><h3>商品图片</h3></div>
                <div class="img_upload_wrap">
                    <div class="img_content">
                        <input class="upload_img_input" type="file" name="image" accept="image/*" th:required="${action == 1}"/>
                        <div th:if="${action == 2}" style="font-size:12px;color:#64748b;margin-top:4px;">如不更换图片可留空</div>
                    </div>
                    <img th:src="${shopInformation.image != null ? shopInformation.image : ''}" class="show_choose_img" id="show_choose_img"/>
                </div>
            </div>

            <div class="submit_content_div">
                <input type="submit" th:value="${action == 2 ? '保存修改' : '立即发布'}" class="submit_input"/>
            </div>
        </form>
    </div>
</div>

<footer>
    <p>Copyright © 2026 校园二手交易平台（Used-Trading-Platform）· 基于 Spring Boot 与 MyBatis</p>
</footer>
</body>
</html>
