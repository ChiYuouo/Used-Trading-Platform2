<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>二手商城 - 校园二手交易平台</title>
    <script src="/js/jquery-1.12.4.js"></script>
    <script src="/js/home/header_model_js.js"></script>
    <script src="/js/mall/type_list_obj.js"></script>
    <script src="/js/mall/left_nav_on_goods_page.js"></script>
    <link rel="icon" href="/img/page_icon.png"/>
    <link href="/css/home_page/header_and_nav.css" rel="stylesheet"/>
    <link href="/css/mall_page/mall_page_other.css" rel="stylesheet"/>
</head>
<body>
<header th:include="header :: copy"></header>
<div th:include="short_nav_show :: short_nav_show" class="short_nav_show"></div>
<nav th:include="my_nav :: my_nav" class="my_nav"></nav>
<div th:include="personal_nav :: personal_nav" class="personal_nav"></div>

<div class="mall_layout">
    <aside class="my_type_div">
        <div class="type_header">商品分类导航</div>
        <ul>
            <li class="type_1">数码科技</li>
            <li class="type_2">影音家电</li>
            <li class="type_3">鞋服配饰</li>
            <li class="type_4">运动代步</li>
            <li class="type_5">书籍文具</li>
            <li class="type_6">其他</li>
        </ul>
    </aside>

    <div class="particular_type_div" onmouseleave="hideParticular()"></div>

    <div class="temp_content" onmousedown="hideParticular()">
        <div class="mall_toolbar">
            <div>
                <span th:if="${searchKeyword == null}">全部在售二手商品</span>
                <span th:if="${searchKeyword != null}">搜索关键词：“<strong th:text="${searchKeyword}"></strong>” 的结果</span>
            </div>
            <div>
                <a href="/mall_page.do" th:if="${searchKeyword != null}" style="color:#4f46e5;text-decoration:none;margin-right:16px;">查看全部</a>
                <span th:if="${shopInformationCounts != null}">共 <strong th:text="${shopInformationCounts}">0</strong> 件在售商品</span>
            </div>
        </div>

        <div class="all_product">
            <div class="product_content_div">
                <div class="detail_product" th:each="o:${shopInformationBean}">
                    <input type="hidden" th:value="${o.id}" name="id"/>
                    <div class="product_img_div">
                        <a th:href="'/selectById.do?id='+${o.id}">
                            <img src="/img/home/feature_prodects/cont2.jpg" th:src="${o.image}" th:title="${o.name}"
                                 class="show_img"
                                 onerror="this.onerror=null;this.src='/img/home/feature_prodects/cont2.jpg'"/>
                        </a>
                    </div>
                    <span class="detail_product_name" th:text="${o.name}" th:value="${o.id}" th:title="${o.name}">商品名称</span>
                    <p class="show_tip" th:text="${o.remark}" th:title="${o.remark}"></p>
                    <div class="card_bottom">
                        <span class="detail_product_cost" th:text="'￥'+${o.price}">￥0.00</span>
                        <span class="detail_buy product_1" th:value="${o.id}">加入购物车</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="pagination_div" onmouseleave="hideParticular()" th:attr="data-total-pages=${totalPages != null ? totalPages : 1}">
            <a class="pagination_lt">&lt;</a>
            <ul>
                <li class="current_page"><a>1</a></li>
                <li><a>2</a></li>
                <li><a>3</a></li>
                <li><a>4</a></li>
                <li><a>5</a></li>
            </ul>
            <a class="pagination_gt">&gt;</a>
        </div>
    </div>
</div>

<footer>
    <p>Copyright © 2026 校园二手交易平台（Used-Trading-Platform）· 基于 Spring Boot 与 MyBatis</p>
</footer>
</body>
</html>
